<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kingdom: Animalia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: a pixel field station. World scene on the left, field-kit panel on the right; stacks on phones. One committed night palette. */
:root {
  color-scheme: dark;
  --night: #141625;
  --panel: #1f2238;
  --panel2: #2a2f4a;
  --line: #3d4466;
  --ink: #f4f4f4;
  --dim: #a9b4cf;
  --notes: #ffcd75;
  --good: #a7f070;
  --slop: #c33cd1;
  --bad: #ef5d6c;
  --sky: #73eff7;
  --f-display: "Press Start 2P", "Courier New", monospace;
  --f-body: "VT323", "Courier New", monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--night); color: var(--ink);
  font: 21px/1.15 var(--f-body);
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
}
.app { height: 100%; display: flex; flex-direction: column; gap: 10px; padding-block: 10px; max-width: 1280px; margin: 0 auto; }
.hud { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font: 18px/1.2 var(--f-display); letter-spacing: .04em; color: var(--ink); text-shadow: 3px 3px 0 #000; }
.brand span { color: var(--good); }
.notesbox { display: flex; align-items: baseline; gap: 10px; background: var(--panel); padding: 6px 14px; box-shadow: 0 0 0 3px #000, 0 4px 0 3px #000; }
.notesbox .lab { color: var(--dim); font-size: 18px; }
#notes { font: 18px/1 var(--f-display); color: var(--notes); font-variant-numeric: tabular-nums; }
#nps { color: var(--dim); font-size: 18px; font-variant-numeric: tabular-nums; }

.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 410px; gap: 14px; }
.stage { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.stagebar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
#regionName { font: 13px var(--f-display); }
.slop { display: flex; align-items: center; gap: 8px; }
.meter { width: 150px; height: 12px; background: #000; box-shadow: 0 0 0 2px var(--line); }
.meter .fill, .hp .fill { height: 100%; background: repeating-linear-gradient(90deg, var(--slop) 0 6px, #8e2aa0 6px 8px); transition: width .4s; }
#slopPct { color: var(--dim); font-size: 18px; min-width: 7ch; }
#scene { width: 100%; aspect-ratio: 16 / 9; image-rendering: pixelated; image-rendering: crisp-edges; display: block; cursor: pointer; box-shadow: 0 0 0 3px #000, 0 6px 0 3px #000; touch-action: manipulation; background: #000; }
.taphint { margin: 2px 0 0; color: var(--dim); font-size: 18px; }

.panel { min-height: 0; display: flex; flex-direction: column; background: var(--panel); box-shadow: 0 0 0 3px #000, 0 6px 0 3px #000; }
.tabs { display: grid; grid-template-columns: repeat(5, 1fr); background: #000; gap: 2px; }
.tab { font: 20px var(--f-body); color: var(--dim); background: var(--panel2); border: 0; padding: 10px 2px; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--panel); color: var(--notes); }
.tab:focus-visible, button:focus-visible, summary:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
.pbody { flex: 1; min-height: 0; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }

button { font-family: var(--f-body); }
.chip { font: 18px var(--f-body); color: var(--ink); background: var(--panel2); border: 0; padding: 4px 12px; cursor: pointer; box-shadow: 0 0 0 2px #000; }
.chip[aria-pressed="true"] { background: var(--notes); color: #1a1c2c; }
.chip.danger { color: var(--bad); align-self: flex-start; }
.modes, .opts { display: flex; gap: 8px; flex-wrap: wrap; }
.row { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--panel2); padding: 8px; box-shadow: 0 0 0 2px #000; }
.row.locked, .row.done { opacity: .85; }
.row.done { grid-template-columns: minmax(0, 1fr) auto; }
.rinfo { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.rinfo b { font: 22px/1 var(--f-body); color: var(--ink); overflow-wrap: anywhere; }
.rinfo small { color: var(--dim); font-size: 17px; }
.rinfo .perk { color: var(--good); }
.rinfo .quote { color: var(--notes); }
.spr { image-rendering: pixelated; display: block; }
.buy { font: 20px/1 var(--f-body); white-space: pre-line; text-align: center; color: #1a1c2c; background: var(--good); border: 0; padding: 7px 10px; cursor: pointer; box-shadow: 0 0 0 2px #000, 0 3px 0 2px #000; min-width: 92px; }
.buy:active { transform: translateY(2px); box-shadow: 0 0 0 2px #000, 0 1px 0 2px #000; }
.buy.cant { background: #59616f; color: #c9cfdb; }
.buy:disabled { background: #444a5c; color: #9aa1b3; cursor: default; }
.buy.wide { width: 100%; padding: 10px; font-size: 22px; }
.printed { color: var(--good); font: 20px var(--f-body); }
.jessiHead { display: flex; gap: 10px; align-items: center; }
.jessiHead div { display: flex; flex-direction: column; }
.jessiHead b { font: 12px/1.4 var(--f-display); }
.jessiHead small, .hint { color: var(--dim); font-size: 18px; margin: 0; }
.rcard { background: var(--panel2); padding: 10px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 0 0 2px #000; }
.rcard.current { box-shadow: 0 0 0 2px var(--notes); }
.rcard.freed .meter .fill { width: 0 !important; }
.rcard.lockedR { opacity: .6; }
.rtop { display: flex; justify-content: space-between; gap: 8px; }
.rtop b { font: 22px var(--f-body); }
.rtop .status { color: var(--notes); font-size: 18px; }
.rcard.freed .status { color: var(--good); }
.rcard small { color: var(--dim); font-size: 17px; }
.rcard .meter { width: 100%; }
.guide { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
.gcard { display: flex; flex-direction: column; align-items: center; gap: 4px; background: var(--panel2); border: 0; color: var(--ink); padding: 8px 4px; font: 16px var(--f-body); cursor: pointer; box-shadow: 0 0 0 2px #000; }
.gcard span { text-align: center; line-height: 1; }
.gcard.missing { color: var(--dim); cursor: default; }
.stats { display: grid; gap: 4px; }
.stats div { display: flex; justify-content: space-between; border-bottom: 1px dashed var(--line); }
.stats b { color: var(--notes); font-variant-numeric: tabular-nums; }
.savebox summary { cursor: pointer; color: var(--dim); }
.savebox textarea { width: 100%; margin: 8px 0; font: 15px monospace; background: #000; color: var(--ink); border: 2px solid var(--line); }

.modal { position: fixed; inset: 0; background: rgba(8, 9, 18, .78); display: flex; align-items: center; justify-content: center; padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); z-index: 20; }
.mbox { width: min(600px, 100%); max-height: 100%; overflow-y: auto; background: var(--panel); padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 0 0 3px #000, 0 0 0 6px var(--line), 0 10px 0 6px #000; }
.talkrow { display: flex; gap: 12px; align-items: flex-start; }
.talkrow.right { flex-direction: row-reverse; }
.por { display: flex; flex-direction: column; align-items: center; gap: 2px; flex: 0 0 auto; }
.por small { font: 18px var(--f-body); color: var(--notes); }
.bubble { flex: 1; background: var(--ink); color: #1a1c2c; padding: 10px 12px; min-height: 84px; box-shadow: 0 0 0 3px #000; }
.bubble.evil { background: #2b0f33; color: #ff9cf2; text-transform: uppercase; letter-spacing: .04em; }
.bubble p { margin: 0; font-size: 22px; }
.card .chead { display: flex; gap: 14px; align-items: center; }
.card h3 { font: 15px/1.4 var(--f-display); margin: 0; }
.card i { color: var(--dim); }
.newtag { align-self: flex-start; background: var(--notes); color: #1a1c2c; font: 19px var(--f-body); padding: 2px 8px; }
.fact { font-size: 22px; margin: 0; }
.perkline { color: var(--good); margin: 0; }
.src { color: var(--dim); font-size: 18px; margin: 0; }

.raidtop { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.raidtop b { font: 12px/1.4 var(--f-display); color: var(--slop); }
.hearts { font-size: 26px; letter-spacing: 2px; color: #444a5c; }
.hearts .full { color: var(--bad); }
.hearts .shield { color: var(--sky); margin-left: 6px; }
.foe { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
.foe small { color: var(--dim); }
.foe .hp { width: 100%; height: 12px; background: #000; box-shadow: 0 0 0 2px var(--line); }
.bossPic { width: 120px !important; height: 120px !important; animation: hover 1.6s steps(4) infinite; }
.foe.halo::before { content: ""; position: absolute; top: -6px; width: 70px; height: 14px; border: 4px solid var(--notes); border-radius: 50%; box-shadow: 0 0 14px var(--notes); }
@keyframes hover { 50% { transform: translateY(-6px); } }
.prompt { margin: 0; color: var(--dim); text-align: center; }
.statement { margin: 0; font-size: 26px; text-align: center; text-wrap: balance; }
.tf { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
.tfb { font-size: 22px; padding: 12px; }
.tfb.real { background: var(--good); }
.tfb.slop { background: var(--slop); color: var(--ink); }
.spot { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-top: 6px; }
.scard { display: flex; flex-direction: column; align-items: center; gap: 4px; background: var(--panel2); color: var(--ink); border: 0; padding: 10px 6px; font: 19px var(--f-body); cursor: pointer; box-shadow: 0 0 0 2px #000, 0 3px 0 2px #000; }
.scard:hover:not(:disabled) { background: #343a5c; }
.scard.wasfake { box-shadow: 0 0 0 3px var(--slop); }
.scard.wasreal { box-shadow: 0 0 0 3px var(--good); }
.powers { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; border-top: 2px dashed var(--line); padding-top: 10px; }
.pw { display: flex; align-items: center; gap: 6px; background: #000; color: var(--sky); border: 0; padding: 4px 10px 4px 4px; font: 17px var(--f-body); cursor: pointer; box-shadow: 0 0 0 2px var(--sky); }
.pw:disabled { color: #555; box-shadow: 0 0 0 2px #333; cursor: default; }
.feedback { padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 0 0 2px #000; }
.feedback.good { background: #1d3a2a; }
.feedback.bad { background: #3a1d26; }
.feedback b { font: 22px var(--f-body); }
.feedback.good b { color: var(--good); }
.feedback.bad b { color: var(--bad); }
.feedback p { margin: 0; }
.feedback small { color: var(--dim); }
.result h3, .credits h3 { font: 14px/1.4 var(--f-display); margin: 0; color: var(--good); }
.result p, .credits p, .credits li { margin: 0; font-size: 21px; }
.credits ul { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; }
.credits .challenge { color: var(--notes); }
.warn { color: var(--notes); }
.ending { text-align: center; align-items: center; }
.ending .crown { font-size: 54px; color: var(--notes); line-height: 1; }
.ending h2 { font: clamp(16px, 4vw, 24px)/1.3 var(--f-display); margin: 0; color: var(--good); text-shadow: 3px 3px 0 #000; }
.ending .big { font: 26px var(--f-body); margin: 0; color: var(--notes); }
.ending p { margin: 0; }
.ending .small { color: var(--dim); }

.banner { position: fixed; left: 0; right: 0; top: 38%; z-index: 40; pointer-events: none; text-align: center; font: clamp(13px, 2.6vw, 26px)/1.4 var(--f-display); color: var(--ink); text-shadow: 4px 4px 0 #000; padding: 16px 12px;
  background: repeating-linear-gradient(-12deg, #c33cd1 0 14px, #9a2bb0 14px 18px); box-shadow: 0 0 0 4px #000; }
.banner.go { animation: slash 1.4s steps(12) forwards; }
@keyframes slash { 0% { transform: translateX(-110%) skewX(-12deg); } 18% { transform: translateX(0) skewX(-12deg); } 80% { transform: translateX(0) skewX(-12deg); opacity: 1; } 100% { transform: translateX(110%) skewX(-12deg); opacity: 0; } }
.toast { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30; background: #000; color: var(--notes); padding: 8px 14px; box-shadow: 0 0 0 3px var(--notes); max-width: calc(100% - 32px); }


#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 45; }
#flash { position: fixed; inset: 0; background: #fff; z-index: 44; pointer-events: none; opacity: 0; }
#flash.go { animation: whiteout .7s steps(7) forwards; }
@keyframes whiteout { 0% { opacity: .9; } 100% { opacity: 0; } }
.buy:hover:not(:disabled):not(.cant), .scard:hover:not(:disabled), .gcard:hover:not(:disabled), .pw:hover:not(:disabled) { transform: translateY(-2px); }
.mbox { animation: popin .22s steps(4); }
@keyframes popin { from { transform: scale(.9); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .mbox, #flash.go { animation: none; } }

/* Pixel frames, drawn in code by chrome.js and stretched around boxes as nine-slice borders. */
.panel, .notesbox { border: 8px solid transparent; border-image: var(--frame-panel) 4 fill / 8px stretch; background: none; box-shadow: none; filter: drop-shadow(0 6px 0 #000); image-rendering: pixelated; }
.mbox { border: 12px solid transparent; border-image: var(--frame-dialog) 4 fill / 12px stretch; background: none; box-shadow: none; filter: drop-shadow(0 10px 0 #000); image-rendering: pixelated; }
.row, .rcard { border: 4px solid transparent; border-image: var(--frame-card) 4 fill / 4px stretch; background: none; box-shadow: none; image-rendering: pixelated; }
.rcard.current { box-shadow: none; outline: 2px solid var(--notes); outline-offset: 1px; }
.tabs { margin: -2px -2px 0; }
.sceneframe { border: 12px solid transparent; border-image: var(--frame-wood) 6 / 12px stretch; filter: drop-shadow(0 6px 0 #000); image-rendering: pixelated; }
.sceneframe #scene { box-shadow: none; }

.howto h3 { font: 14px/1.4 var(--f-display); margin: 0; color: var(--good); }
.steps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; counter-reset: step; }
.steps li { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: center; counter-increment: step; }
.steps b { display: block; font: 22px/1 var(--f-body); color: var(--notes); }
.steps b::before { content: counter(step) ". "; }
.steps span { font-size: 19px; }

/* Title screen and the new-region card. */
#title, #reveal { position: fixed; inset: 0; z-index: 60; background: #000; cursor: pointer; overflow: hidden; }
#reveal { z-index: 55; }
#titleCv, #revealCv { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }
.tlogo { position: absolute; left: 0; right: 0; top: 5%; text-align: center; pointer-events: none; padding-inline: 12px; }
.tlogo .k { font: clamp(14px, 3vw, 30px)/1 var(--f-display); letter-spacing: .12em; color: var(--ink); text-shadow: 3px 3px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000; }
.tlogo .a { display: inline-block; margin-top: 8px; font: clamp(26px, 7vw, 76px)/1.1 var(--f-display); color: var(--good); text-shadow: 0 5px 0 #257179, 4px 9px 0 #000, -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000; animation: tbob 1.2s steps(2) infinite; }
.tlogo .sub { display: inline-block; margin-top: 12px; padding: 2px 12px; background: rgba(20, 22, 37, .8); font: clamp(18px, 2.4vw, 26px) var(--f-body); color: var(--notes); text-shadow: 2px 2px 0 #000; }
.tstart, .tcredit { position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap; background: rgba(20, 22, 37, .82); text-align: center; pointer-events: none; box-shadow: 0 0 0 3px #000; }
.tstart { bottom: 14%; padding: 10px 16px; font: clamp(11px, 2vw, 18px) var(--f-display); color: #fff; text-shadow: 3px 3px 0 #000; animation: blinky 1s steps(1) infinite; }
.tcredit { bottom: max(3%, env(safe-area-inset-bottom, 0px)); padding: 2px 12px; font: 19px var(--f-body); color: var(--ink); }
#title.leaving { animation: tout .45s steps(5) forwards; }
.rcardx { position: absolute; left: 0; right: 0; top: 36%; text-align: center; pointer-events: none; padding-inline: 12px; }
.rcardx small { display: block; font: clamp(10px, 1.6vw, 15px) var(--f-display); color: var(--notes); letter-spacing: .2em; text-shadow: 2px 2px 0 #000; }
#revealName { display: block; margin: 10px 0; font: clamp(18px, 5vw, 48px)/1.2 var(--f-display); color: var(--ink); text-shadow: 4px 4px 0 #000, -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000; }
#revealSub { font: clamp(20px, 2.6vw, 28px) var(--f-body); color: var(--ink); text-shadow: 2px 2px 0 #000; }
#reveal.show .rcardx { animation: stamp .5s steps(5) .8s both; }
@keyframes tout { to { opacity: 0; } }
@keyframes blinky { 50% { opacity: 0; } }
@keyframes tbob { 50% { transform: translateY(-4px); } }
@keyframes stamp { from { transform: scale(1.8); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .tlogo .a, .tstart, #reveal.show .rcardx, #title.leaving { animation: none; } }

@media (max-width: 860px) {
  html, body { height: auto; }
  .app { height: auto; }
  .main { grid-template-columns: minmax(0, 1fr); }
  .pbody { max-height: none; overflow: visible; }
  .brand { font-size: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  .banner.go { animation: none; }
  .bossPic { animation: none; }
  .meter .fill, .hp .fill { transition: none; }
}
</style>

<div class="app">
  <header class="hud">
    <div class="brand">KINGDOM: <span>ANIMALIA</span></div>
    <div class="notesbox"><span class="lab">Field notes</span><b id="notes">0</b><small id="nps">0 / sec</small></div>
  </header>
  <main class="main">
    <section class="stage" aria-label="Your world">
      <div class="stagebar">
        <b id="regionName">The Backyard</b>
        <div class="slop"><div class="meter"><div id="slopFill" class="fill"></div></div><small id="slopPct"></small></div>
      </div>
      <div class="sceneframe"><canvas id="scene" role="img" aria-label="Your world. Tap it to take field notes."></canvas></div>
      <p class="taphint">Tap the scene (or press Space) to take field notes. Catch shiny things if a crow brings them.</p>
    </section>
    <aside class="panel" aria-label="Field kit">
      <nav class="tabs" role="tablist" aria-label="Field kit">
        <button type="button" class="tab" role="tab" data-tab="animals" aria-selected="true">Animals</button>
        <button type="button" class="tab" role="tab" data-tab="workshop" aria-selected="false">Workshop</button>
        <button type="button" class="tab" role="tab" data-tab="raids" aria-selected="false">Raids</button>
        <button type="button" class="tab" role="tab" data-tab="guide" aria-selected="false">Guide</button>
        <button type="button" class="tab" role="tab" data-tab="more" aria-selected="false">More</button>
      </nav>
      <div id="panelBody" class="pbody"></div>
    </aside>
  </main>
</div>
<div id="modal" class="modal" hidden><div id="modalBox" class="mbox" role="dialog" aria-modal="true" aria-label="Kingdom: Animalia"></div></div>
<div id="banner" class="banner" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<div id="title" role="button" aria-label="Kingdom: Animalia. Press any key or tap to start." hidden>
  <canvas id="titleCv" aria-hidden="true"></canvas>
  <div class="tlogo"><div class="k">KINGDOM:</div><div class="a">ANIMALIA</div><div class="sub">Every animal is real. Prove it.</div></div>
  <div class="tstart">PRESS ANY KEY</div>
  <div class="tcredit">Made for AJ · directed by Jessi</div>
</div>
<div id="reveal" role="status" hidden>
  <canvas id="revealCv" aria-hidden="true"></canvas>
  <div class="rcardx"><small>NEW REGION</small><b id="revealName"></b><div id="revealSub"></div></div>
</div>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="flash" hidden></div>
<script>
// Every sprite is hand-placed pixels: one character per pixel, 16x16.
// Palette is Sweetie 16 plus a few earth tones. "." is transparent.
const PAL = {
  k: "#1a1c2c", w: "#f4f4f4", r: "#b13e53", o: "#ef7d57", y: "#ffcd75",
  g: "#a7f070", G: "#38b764", t: "#257179", b: "#29366f", B: "#3b5dc9",
  c: "#41a6f6", C: "#73eff7", s: "#94b0c2", S: "#566c86", d: "#333c57",
  P: "#5d275d", n: "#8a5a3b", N: "#5c3a24", m: "#d9a066", x: "#f4a6b8",
  D: "#2b2421", e: "#e04a3f"
};

// m: true means the rows are the left half; the right half is mirrored.
const SPRITE_ROWS = {
  chicken: [   // Jessi's silkies: black, pom-pom crest, turquoise earlobe, feathered feet
    "......kkkk......",
    ".....kDDDDk.....",
    "....kDSDDDDk....",
    "...kDDDDDDDDk...",
    "...kDDDDDDwkDok.",
    "...kDDDDDDDook..",
    "..kDDDDDDDCDk...",
    ".kDDDDDDDDDDk...",
    "kDDDSDDDDDDDDk..",
    "kDDDDSDDDDSDDk..",
    "kDDDDDSDDSDDDk..",
    ".kDDDDDDDDDDk...",

// Lex's named rats: recolors of the rat sprite (n = hood/patches, w = body).
const RAT_COLORS = { evil: { n: "s" }, gidget: { n: "S", w: "s" }, gordito: { n: "m", w: "m" }, eyebrows: { n: "N", w: "n" } };
for (const [k, map] of Object.entries(RAT_COLORS)) SPRITE_ROWS[k] = SPRITE_ROWS.rat.map(r => r.replace(/[nw]/g, c => map[c] || c));

// Normalize every sprite to exactly 16x16, bottom-aligned so animals stand on the ground.
const SPR = {};
for (const [name, def] of Object.entries(SPRITE_ROWS)) {
  let rows = Array.isArray(def) ? def : def.rows;
  if (!Array.isArray(def) && def.m) {
    rows = rows.map(r => {
      const half = (r + "........").slice(0, 8);
      return half + half.split("").reverse().join("");
    });
  }
  rows = rows.map(r => (r + "................").slice(0, 16));
  while (rows.length < 16) rows.unshift("................");
  SPR[name] = rows.slice(-16);
}

// The 32x32 set (sprites_hd.js) wins when it has the animal; otherwise the 16x16 one is doubled.
const hdRows = (name) => (typeof SPRH !== "undefined" && SPRH[name]) || double(SPR[name]);
function double(rows) { return rows.flatMap(r => { const d = r.replace(/./g, "$&$&"); return [d, d]; }); }
const NO_SHADE = new Set(["k", "K", "w"]);

// Paint a sprite onto a 32x32 offscreen canvas once; reuse it everywhere.
const SPRITE_CACHE = {};
function spriteCanvas(name, opts) {
  opts = opts || {};
  const key = name + "|" + (opts.tint ? (opts.tint.name || "t") : "") + "|" + (opts.rows ? opts.rows.join("") : "") + (opts.blink ? "|blink" : "");
  if (SPRITE_CACHE[key]) return SPRITE_CACHE[key];
  let rows = opts.rows || hdRows(name);
  if (rows.length === 16) rows = double(rows);
  if (opts.blink && typeof EYES !== "undefined" && EYES[name]) rows = blinkRows(rows, EYES[name]);
  const cv = document.createElement("canvas");
  cv.width = 32; cv.height = 32;
  const g = cv.getContext("2d");
  const at = (x, y) => (y >= 0 && y < 32 && x >= 0 && x < 32) ? rows[y][x] : ".";
  const edge = (x, y) => { const c = at(x, y); return c === "." || c === "k"; };
  for (let y = 0; y < 32; y++) {
    for (let x = 0; x < 32; x++) {
      const ch = rows[y][x];
      if (ch === "." || !PAL[ch]) continue;
      let col = PAL[ch];
      if (opts.tint && ch !== "k") col = opts.tint(col, x, y);
      if (ch === "k") {
        // Outer outline on top edges picks up the color it wraps, so shapes look lit instead of stamped.
        const below = at(x, y + 1);
        if (at(x, y - 1) === "." && below !== "." && below !== "k" && PAL[below]) col = shade(opts.tint ? opts.tint(PAL[below], x, y) : PAL[below], -0.6);
      } else if (!NO_SHADE.has(ch) && !opts.flat) {
        // Soft dome shading: light from the top left, two pixels deep.
        let amt = 0;
        if (edge(x, y - 1)) amt += 0.24; else if (edge(x, y - 2)) amt += 0.1;
        if (edge(x - 1, y)) amt += 0.08;
        if (edge(x, y + 1)) amt -= 0.22; else if (edge(x, y + 2)) amt -= 0.08;
        if (edge(x + 1, y)) amt -= 0.08;
        if (amt) col = shade(col, Math.max(-0.3, Math.min(0.3, amt)));
      }
      g.fillStyle = col;
      g.fillRect(x, y, 1, 1);
    }
  }
  SPRITE_CACHE[key] = cv;
  return cv;
}

// A blink: each eye pixel takes the color of the fur above it, and the bottom row becomes the closed lid line.
function blinkRows(rows, eyes) {
  const isEye = new Set(eyes.map(([x, y]) => x + "," + y));
  const out = rows.map(r => r.split(""));
  for (const [x, y] of eyes) {
    let yy = y - 1;
    while (yy > 0 && (isEye.has(x + "," + yy) || rows[yy][x] === "k" || rows[yy][x] === ".")) yy--;
    out[y][x] = isEye.has(x + "," + (y + 1)) ? rows[yy][x] : "k";
  }
  return out.map(r => r.join(""));
}

// Lighten (amt > 0) or darken (amt < 0) a hex color.
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  return "#" + [16, 8, 0].map(sh => {
    const c = (n >> sh) & 255;
    const v = amt > 0 ? c + (255 - c) * amt : c * (1 + amt);
    return Math.round(v).toString(16).padStart(2, "0");
  }).join("");
}

// Slop chimeras: the top half of one real animal stitched to the bottom half of another,
// with an off color shimmer. The joke is that they look almost plausible.
function chimeraRows(a, b) {
  return hdRows(a).slice(0, 16).concat(hdRows(b).slice(16));
}
function slopTint(hex, x, y) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, bl = n & 255;
  const shift = ((x + y) % 3) * 18;
  r = Math.min(255, r * 0.7 + 90 + shift); g = g * 0.55; bl = Math.min(255, bl * 0.8 + 110);
  return "#" + [r, g, bl].map(v => Math.round(v).toString(16).padStart(2, "0")).join("");
}

  const amer = () => {

  return {
    draw(region, t, S) { painted(region, STATIC[region]); MOVING[region](t, S); },
    circle
  };
}

<script>
// Screen dressing: pixel frames for the menus, the title screen, and the card that
// reveals each new region. Everything here is drawn in code too.

// ---------- pixel frames ----------
// A 12x12 nine-slice frame: black edge with notched corners, a bevel lit from the top left,
// and optional rivets. CSS stretches it around any box (see .framed in shell.html).
function pixelFrame(fill, light, dark, rivet) {
  const c = document.createElement("canvas"); c.width = c.height = 12;
  const x = c.getContext("2d");
  const px = (col, a, b, w = 1, h = 1) => { x.fillStyle = col; x.fillRect(a, b, w, h); };
  px(fill, 1, 1, 10, 10);
  px("#000", 1, 0, 10, 1); px("#000", 1, 11, 10, 1); px("#000", 0, 1, 1, 10); px("#000", 11, 1, 1, 10);
  for (const [a, b] of [[1, 1], [10, 1], [1, 10], [10, 10]]) px("#000", a, b);
  px(light, 2, 1, 8, 1); px(light, 1, 2, 1, 8);
  px(dark, 2, 10, 8, 1); px(dark, 10, 2, 1, 8);
  if (rivet) for (const [a, b] of [[2, 2], [9, 2], [2, 9], [9, 9]]) px(rivet, a, b);
  return c.toDataURL();
}
// The wooden field-station frame around the scene: planks with grain, nails in the corners.
function woodFrame() {
  const c = document.createElement("canvas"); c.width = c.height = 18;
  const x = c.getContext("2d");
  const px = (col, a, b, w = 1, h = 1) => { x.fillStyle = col; x.fillRect(a, b, w, h); };
  px("#000", 0, 0, 18, 18);
  px("#8a5a3b", 1, 1, 16, 16);
  px("#d9a066", 1, 1, 16, 1); px("#d9a066", 1, 1, 1, 16);
  px("#5c3a24", 1, 16, 16, 1); px("#5c3a24", 16, 1, 1, 16);
  for (const y of [3, 13]) px("#6e472d", 3, y, 12, 1);                 // grain along the planks
  for (const xx of [3, 13]) px("#6e472d", xx, 4, 1, 10);
  px("#000", 5, 5, 8, 8);                                              // inner lip around the picture
  for (const [a, b] of [[2, 2], [14, 2], [2, 14], [14, 14]]) { px("#c6ccd6", a, b); px("#566c86", a + 1, b + 1); }
  return c.toDataURL();
}
(function installFrames() {
  const root = document.documentElement.style;
  root.setProperty("--frame-panel", "url(" + pixelFrame("#1f2238", "#4a5280", "#0d0f1c") + ")");
  root.setProperty("--frame-card", "url(" + pixelFrame("#2a2f4a", "#525b8a", "#161929") + ")");
  root.setProperty("--frame-dialog", "url(" + pixelFrame("#1f2238", "#4a5280", "#0d0f1c", "#ffcd75") + ")");
  root.setProperty("--frame-wood", "url(" + woodFrame() + ")");
})();

// ---------- the title screen ----------
// The backyard at golden hour, AJ front and center, and a parade of everyone he'll recruit.
function titleScreen(done) {
  const wrap = document.getElementById("title");
  const cv = document.getElementById("titleCv"), g = cv.getContext("2d");
  const W = 320, H = 180;
  cv.width = W; cv.height = H; g.imageSmoothingEnabled = false;
  const scenery = Scenery(g, W, H);
  const walkers = ["chicken", "dog", "shadow", "wednesday", "bonnie", "graysilkie", "squirrel", "raccoon", "opossum", "bear", "pronghorn", "axolotl", "elephant", "platypus", "wombat", "tardigrade"];
  const flyers = ["crow", "monarch", "falcon", "honeybee"];
  let on = true;
  function frame(t) {
    if (!on) return;
    scenery.draw("yard", t, { liberated: 0 });
    g.fillStyle = "rgba(239, 125, 87, 0.18)"; g.fillRect(0, 0, W, H);           // golden hour wash
    // AJ, a little larger than life
    const bob = Math.floor(t / 500) % 2;
    g.drawImage(spriteCanvas("aj"), 128, 52 + bob, 64, 64);
    g.fillStyle = "#2f9c55"; for (let x = 120; x < 200; x += 3) g.fillRect(x, 113 + (x % 2), 2, 4);
    // the parade
    const span = walkers.length * 38;
    walkers.forEach((id, i) => {
      const x = ((t / 28 + i * 38) % span) - 40, step = Math.floor(t / 160 + i) % 2 ? 1 : -1;
      const y = 136 + (i % 2) * 10, img = spriteCanvas(id);
      g.drawImage(img, 0, 0, 32, 26, Math.round(x), y, 32, 26);
      g.drawImage(img, 0, 26, 32, 6, Math.round(x) + step, y + 26, 32, 6);
    });
    flyers.forEach((id, i) => {
      const x = W - ((t / 18 + i * 90) % (W + 60)) + 10, y = 14 + i * 9 + Math.sin(t / 300 + i) * 4;
      g.save(); g.translate(Math.round(x) + 32, Math.round(y)); g.scale(-1, 1); g.drawImage(spriteCanvas(id), 0, 0); g.restore();
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  if (matchMedia("(pointer: coarse)").matches) wrap.querySelector(".tstart").textContent = "TAP TO START";
  wrap.hidden = false;
  const go = () => {
    if (!on) return;
    on = false;
    wrap.classList.add("leaving");
    document.removeEventListener("keydown", key);
    setTimeout(() => { wrap.hidden = true; done(); }, 450);
  };
  const key = (ev) => { if (ev.key !== "Tab") { ev.preventDefault(); go(); } };
  wrap.addEventListener("pointerdown", go);
  document.addEventListener("keydown", key);
}

// ---------- new region reveal ----------
// The new region opens up behind an iris wipe, with its name stamped across the middle.
function revealRegion(region, done) {
  const wrap = document.getElementById("reveal");
  const cv = document.getElementById("revealCv"), g = cv.getContext("2d");
  const W = 320, H = 180;
  cv.width = W; cv.height = H; g.imageSmoothingEnabled = false;
  const scenery = Scenery(g, W, H);
  document.getElementById("revealName").textContent = region.name;
  document.getElementById("revealSub").textContent = region.sub;
  wrap.hidden = false; wrap.classList.remove("show"); void wrap.offsetWidth; wrap.classList.add("show");
  const start = performance.now();
  let on = true;
  function frame(t) {
    if (!on) return;
    g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
    const r = Math.min(1, (t - start) / 900) * 200;
    g.save(); g.beginPath();
    for (let dy = -Math.floor(r); dy <= r; dy += 1) {                         // a stepped pixel circle, not a smooth one
      const w = Math.round(Math.sqrt(r * r - dy * dy) / 4) * 4;
      g.rect(160 - w, 90 + dy, w * 2, 1);
    }
    g.clip();
    scenery.draw(region.id, t, { liberated: 0 });
    g.restore();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  const go = () => {
    if (!on) return;
    on = false; wrap.hidden = true; wrap.removeEventListener("pointerdown", go); clearTimeout(timer); done();
  };
  const timer = setTimeout(go, 3200);
  wrap.addEventListener("pointerdown", go);
}

<script>
// Economy shared by the game and the balance simulator.
const ECON = {
  costBase: 15, costGrowth: 2.7,   // animal i's first recruit costs costBase * costGrowth^i
  payBase: 8, payGrowth: 1.28,     // seconds of payback at base: payBase * payGrowth^i
  levelGrowth: 1.15,               // each extra of the same animal costs 15% more
  libBonus: 1.6,                   // each liberated region multiplies all notes
  raidsPerRegion: 3
};

const PERK_PCT = { opossum: 5, bat: 10, bear: 10, pronghorn: 10, leafcutter: 20, elephant: 10, wombat: 25,
  molerat: 15, otter: 25, jellyfish: 30, whale: 50 };
const REGION_PERK = { hellbender: [1, 10], eel: [2, 15], pistol: [4, 20] };

function animalBaseCost(i) { return ECON.costBase * Math.pow(ECON.costGrowth, i); }
function animalBaseProd(i) { return animalBaseCost(i) / (ECON.payBase * Math.pow(ECON.payGrowth, i)); }
function animalCost(i, owned, discount = 1) { return Math.ceil(animalBaseCost(i) * Math.pow(ECON.levelGrowth, owned) * discount); }

// state: { owned: {id: n}, upgrades: {id: true}, liberated: n }
function computeRates(state, animals, upgrades) {
  let allMul = 1, tapMul = 1, regionMul = {};
  for (const u of upgrades) {
    if (!state.upgrades[u.id]) continue;
    if (u.eff.allMul) allMul *= u.eff.allMul;
    if (u.eff.tapMul) tapMul *= u.eff.tapMul;
    if (u.eff.regionMul) regionMul[u.eff.regionMul[0]] = (regionMul[u.eff.regionMul[0]] || 1) * u.eff.regionMul[1];
  }
  let pct = 0;
  const regionPct = {};

  // ---------- raids ----------
  function blendName(a, b) {
    const A = a.name.split(" ").pop(), B = b.name.split(" ").pop();
    return (A.slice(0, Math.ceil(A.length / 2)) + B.slice(Math.floor(B.length / 2))).replace(/^./, c => c.toUpperCase());
  }
  function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function makeQuestion(regionIdx, used) {
    const pool = ANIMALS.filter(a => a.region <= regionIdx + 1);
    if (Math.random() < 0.4) {
      // Creature round: spot the slop (or, sometimes, spot the real one).
      const findReal = Math.random() < 0.35;
      const reals = shuffle(ANIMALS.slice()).slice(0, findReal ? 1 : 2);
      const fakes = [];
      while (fakes.length < (findReal ? 2 : 1)) {
        const A = pick(pool), B = pick(ANIMALS);
        if (A.id === B.id) continue;
        fakes.push({ name: blendName(A, B), rows: chimeraRows(A.id, B.id), fake: true });
      }
      const cards = shuffle(reals.map(a => ({ name: a.name, id: a.id, fake: false, sci: a.sci })).concat(fakes));
      return { kind: "spot", findReal, cards };
    }
    // Statement round.
    const opts = [];
    for (const a of pool) { opts.push({ text: a.real, truth: true, after: a.fact, src: a.source }); opts.push({ text: a.slop, truth: false, after: a.fix, src: a.source }); }
    for (const [m, fix] of MYTHS) opts.push({ text: m, truth: false, after: fix });
    for (const t of TRUE_EXTRAS) opts.push({ text: t, truth: true, after: "Real. Weird, but real." });
    let q, tries = 0;
    do { q = pick(opts); tries++; } while (used.has(q.text) && tries < 50);
    used.add(q.text);
    return Object.assign({ kind: "fact" }, q);
  }

  function startRaid(regionIdx, isBoss, cost) {
    const reg = REGIONS[regionIdx];
    const begin = () => runRaid(regionIdx, isBoss, cost);
    if (isBoss) dialog(STORY.bossIntro[reg.boss], reg.boss, begin); else begin();
  }

  function runRaid(regionIdx, isBoss, cost) {
    const reg = REGIONS[regionIdx];
    const maxHearts = 3 + (isBoss && S.owned.lyrebird > 0 ? 1 : 0);
    const st = { hearts: maxHearts, hp: isBoss ? 8 : 5, maxHp: isBoss ? 8 : 5, mult: 1, shield: false, used: new Set(), powersUsed: {}, q: null, answered: false };
    const powers = Object.entries(POWER_INFO).filter(([, p]) => p.animal === "shadow" || p.animal === "bonnie" || p.animal === "wednesday" || S.owned[p.animal] > 0);

    const draw = () => {
      const box = openModal("raid");
      const top = el("div", "raidtop");
      top.append(el("b", null, isBoss ? BOSSES[reg.boss].name : "Slop Raid · " + reg.name));
      const hearts = el("span", "hearts");
      for (let i = 0; i < maxHearts; i++) hearts.append(el("span", i < st.hearts ? "h full" : "h", "♥"));
      if (st.shield) hearts.append(el("span", "shield", "◆"));
      top.append(hearts); box.append(top);
      const foe = el("div", "foe");
      if (isBoss) {
        const B = BOSSES[reg.boss];
        const pic = portrait("boss", reg.boss); pic.classList.add("bossPic"); if (B.halo) foe.classList.add("halo");
        foe.append(pic);
      }
      const hp = el("div", "hp"); const hf = el("div", "fill"); hf.style.width = (st.hp / st.maxHp * 100) + "%"; hp.append(hf);
      foe.append(el("small", null, isBoss ? "Boss slop" : "Slop wave"), hp);
      box.append(foe);
      if (!st.q) st.q = makeQuestion(regionIdx, st.used);
      const q = st.q;
      const area = el("div", "qarea");
      if (q.kind === "spot") {
        area.append(el("p", "prompt", q.findReal ? "Two of these are slop. Which one is REAL?" : "One of these is slop. Which one is FAKE?"));
        const cards = el("div", "spot");
        q.cards.forEach((c, idx) => {
          if (c.removed) return;
          const b = el("button", "scard"); b.type = "button";
          b.append(c.fake ? spriteImg("fake-" + c.name, { rows: c.rows, tint: subtleTint }, 72) : spriteImg(c.id, null, 72), el("span", null, c.name));
          b.dataset.key = String(idx + 1);
          b.onclick = () => answer(c.fake !== q.findReal, c);
          if (st.answered) { b.disabled = true; if (c.fake) b.classList.add("wasfake"); else b.classList.add("wasreal"); }
          cards.append(b);
        });
        area.append(cards);
      } else {
        area.append(el("p", "prompt", "Real, or slop?"), el("p", "statement", "“" + q.text + "”"));
        const row = el("div", "tf");
        const real = el("button", "buy tfb real", "REAL"); real.type = "button"; real.dataset.key = "r"; real.onclick = () => answer(q.truth === true);
        const slop = el("button", "buy tfb slop", "SLOP"); slop.type = "button"; slop.dataset.key = "s"; slop.onclick = () => answer(q.truth === false);
        if (st.answered) { real.disabled = slop.disabled = true; }
        row.append(real, slop); area.append(row);
      }
      box.append(area);
      if (st.feedback) box.append(st.feedback);
      if (!st.answered && powers.length) {
        const pr = el("div", "powers");
        for (const [key, p] of powers) {
          const b = el("button", "pw"); b.type = "button";
          b.append(spriteImg(p.animal, null, 28), el("span", null, p.name));
          b.title = p.desc;
          const unusable = st.powersUsed[key] || (key === "waggle" && q.kind !== "spot");
          b.disabled = !!unusable;
          b.onclick = () => usePower(key, p);
          pr.append(b);
        }
        box.append(pr);
      }
      if (st.answered) {
        const next = el("button", "buy wide", st.hp <= 0 ? "Finish them" : st.hearts <= 0 ? "Retreat" : "Next"); next.type = "button";
        next.onclick = () => {
          if (st.hp <= 0) return win();
          if (st.hearts <= 0) return lose();
          st.q = null; st.answered = false; st.feedback = null; draw();
        };
        box.append(next); next.focus();
      }
    };

    const answer = (correct, card) => {
      if (st.answered) return;
      st.answered = true;
      const q = st.q;
      const fb = el("div", "feedback " + (correct ? "good" : "bad"));
      if (correct) {
        const dmg = st.mult; st.hp = Math.max(0, st.hp - dmg); st.mult = 1;
        S.stats.correct++;
        fb.append(el("b", null, dmg > 1 ? "CRITICAL! " + dmg + "x damage" : "Got it."));
        sfx.right(); setTimeout(sfx.hit, 120); shake = 8;
      } else {
        S.stats.wrong++;
        if (st.shield) { st.shield = false; fb.append(el("b", null, "Fooled, but the tardigrade shrugged it off.")); }
        else { st.hearts--; fb.append(el("b", null, "The slop got you.")); }
        sfx.wrong();
      }
      if (q.kind === "fact") {
        fb.append(el("p", null, (q.truth ? "Real. " : "Slop. ") + q.after));
        if (q.src) fb.append(el("small", null, "Source: " + q.src));
      } else {
        const realOnes = q.cards.filter(c => !c.fake).map(c => c.name).join(" and ");
        fb.append(el("p", null, realOnes + (q.cards.filter(c => !c.fake).length > 1 ? " are" : " is") + " real. The rest were stitched together by the Slop Machine."));
      }
      st.feedback = fb;
      draw();
    };

    const usePower = (key, p) => {
      st.powersUsed[key] = true;
      banner(p.who.toUpperCase() + ": " + p.name.toUpperCase() + "!");
      sfx.power();
      const q = st.q;
      if (key === "electro") { return setTimeout(() => answer(true), 500); }
      if (key === "fries") { st.hp = Math.max(0, st.hp - 2); shake = 14; sfx.hit(); setTimeout(sfx.hit, 140); if (st.hp <= 0) { st.answered = true; st.feedback = el("div", "feedback good"); st.feedback.append(el("b", null, "Angel ate the slop. AJ, check your shoes.")); } }
      if (key === "hiss") { st.hp = Math.max(0, st.hp - 1); shake = 10; sfx.hit(); if (st.hp <= 0) { st.answered = true; st.feedback = el("div", "feedback good"); st.feedback.append(el("b", null, "Shadow hissed the last of it away.")); } }
      if (key === "regen") st.hearts = Math.min(maxHearts, st.hearts + 1);
      if (key === "punch") st.mult = Math.max(st.mult, 2);
      if (key === "cavitation") st.mult = Math.max(st.mult, 3);
      if (key === "shield" || key === "pack") st.shield = true;
      if (key === "ink" || key === "thump") { st.q = null; }
      if (key === "waggle" && q.kind === "spot") {
        const wrong = q.cards.filter(c => !c.removed && (c.fake === q.findReal));
        if (wrong.length) wrong[0].removed = true;
      }
      draw();
    };

    const win = () => {
      const reward = Math.ceil(cost * 1.5 * raidMul());
      S.notes += reward; S.total += reward; S.stats.raidsWon++;
      sfx.win(); confetti(isBoss ? 160 : 70);
      if (isBoss) {
        flash();
        S.liberated++; S.raids = 0; recalc(); rebuildActors(); save();
        closeModal();
        const lines = STORY.bossWin[reg.boss];
        dialog(lines, reg.boss, () => {
          renderPanel();
          if (S.liberated >= REGIONS.length) ending();
          else revealRegion(REGIONS[S.liberated], () => toast(REGIONS[S.liberated].name + " unlocked. New animals to recruit!"));
        });
      } else {
        S.raids++; recalc(); rebuildActors(); save();
        const box = openModal("raid result");
        box.append(el("h3", null, "Raid cleared!"), el("p", null, reg.name + " slop down to " + Math.max(0, 100 - S.raids * 30) + "%. You recovered " + fmt(reward) + " field notes."));
        if (S.raids >= 3) box.append(el("p", "warn", "Something big is coming. The boss is ready in the Raids tab."));
        const ok = el("button", "buy wide", "Back to the field"); ok.type = "button"; ok.onclick = () => { closeModal(); renderPanel(); }; box.append(ok); ok.focus();
      }
    };
    const lose = () => {
      S.stats.raidsLost++; save();
      const box = openModal("raid result");
      box.append(el("h3", null, "The slop held its ground."), el("p", null, "No shame in it. Every wrong answer told you something true. Recruit more animals for powers and try again."));
      const ok = el("button", "buy wide", "Back to the field"); ok.type = "button"; ok.onclick = () => { closeModal(); renderPanel(); }; box.append(ok); ok.focus();
    };
    draw();
  }
  // Fake cards in raids get only a faint shimmer, so they're actually hard to spot.
  function subtleTint(hex, x, y) { return ((x * 7 + y * 3) % 23 === 0) ? "#c33cd1" : hex; }

  function banner(text) {
    const b = $("#banner"); b.textContent = text; b.hidden = false;
    b.classList.remove("go"); void b.offsetWidth; b.classList.add("go");
    clearTimeout(banner.t); banner.t = setTimeout(() => { b.hidden = true; }, 1400);
  }
  function toast(text) {
    const t = $("#toast"); t.textContent = text; t.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 2600);
  }

  function ending() {
    S.ended = true; save();
    const box = openModal("ending");
    box.append(el("div", "crown", "♛"), el("h2", null, "KINGDOM: ANIMALIA"), el("p", "big", "AJ, Ruler of All Living Things"), el("p", null, "Every animal on Earth is real again. One tardigrade is still in orbit, vibing."));
    const st = el("p", "small", "Slop spotted: " + S.stats.correct + " · Times fooled: " + S.stats.wrong + " · Raids won: " + S.stats.raidsWon);
    box.append(st);
    const b = el("button", "buy wide", "How this was made"); b.type = "button"; b.onclick = credits; box.append(b);
    const k = el("button", "chip", "Keep playing"); k.type = "button"; k.onclick = closeModal; box.append(k);
  }
  function credits() {
    const box = openModal("credits");
    box.append(el("h3", null, "How this was made"));
    const p = (t) => box.append(el("p", null, t));
    p("Kingdom: Animalia was made for AJ by his sister Jessi, with cameos from Shadow, Angel, Wednesday, Jessi's silkies, and Lex's rats (led by Bonnie). The idea, the hero, and the whole \"take over the world with animals\" plan were hers.");
    p("She built it with Claude, an AI from Anthropic, over a couple of sessions. Here's what that means, and what it doesn't:");
    const ul = el("ul");
    for (const t of [
      "No AI image generators and no traced art. Claude wrote the drawing code while Jessi directed: every sprite is simple shapes plus pixels placed one at a time, saved as text in the code, one character per pixel. AJ's own sprite was drawn by eye from a photo Jessi chose.",
      "The scenery is drawn the same way, by code, a few colored rectangles at a time.",
      "Every animal fact was checked against the source printed on its card, and the tricky ones are worded carefully. Lyrebirds mostly copy other birds; the chainsaw ones live near people.",
      "The villain is AI slop on purpose. Fake animals and confident wrong facts are the enemy, and knowing real animals is how you win.",
      "The music and sound effects are generated live in your browser by code."
    ]) ul.append(el("li", null, t));
    box.append(ul);
    box.append(el("p", "challenge", "The challenge: you know more about animals than both of us. Find a fact in here that's wrong, tell Jessi, and you win. It gets fixed and you get bragging rights."));
    const ok = el("button", "buy wide", "Back"); ok.type = "button"; ok.onclick = closeModal; box.append(ok); ok.focus();
  }

  function howToPlay(done) {
    const box = openModal("howto");
    box.append(el("h3", null, "How to play"));
    const list = el("ol", "steps");
    for (const [icon, title, text] of [
      ["chicken", "Take field notes", "Tap the scene (or press Space). Every tap earns notes."],
      ["dog", "Recruit animals", "Spend notes on animals. They earn notes on their own, and each one comes with a real fact card."],
      ["jessi", "Visit the Workshop", "Jessi prints gear that boosts everything. Some of it is useless. On purpose."],
      ["machine", "Raid the slop", "Real or slop? Spot the fake animals and the false facts. Your animals give you powers to use."],
      ["hand", "Beat the boss", "Three raids clear a region's slop, then its boss shows up. Win to free the region and find new animals."],
      ["shadow", "Fill your guide", "The Guide tab keeps every fact card. Find one that's wrong and you win the challenge."]
    ]) {
      const li = el("li");
      const t = el("div"); t.append(el("b", null, title), el("span", null, text));
      li.append(spriteImg(icon, null, 44), t);
      list.append(li);
    }
    box.append(list);
    box.append(el("p", "src", "Keys: Space taps. In raids, R = real, S = slop, 1 to 3 pick a card. Progress saves by itself in this browser; More → \"Move your save\" carries it to another device."));
    const ok = el("button", "buy wide", "Got it"); ok.type = "button"; ok.onclick = () => { closeModal(); done && done(); }; box.append(ok); ok.focus();
  }

  // ---------- keyboard ----------
  document.addEventListener("keydown", (ev) => {
    if (ev.target.closest && ev.target.closest("textarea, input")) return;
    if (!$("#title").hidden || !$("#reveal").hidden) return;
    if (!modal.hidden) {
      const k = ev.key.toLowerCase();
      const b = mbox.querySelector(`button[data-key="${k}"]:not(:disabled)`);
      if (b) { ev.preventDefault(); b.click(); }
      return;
    }
    if (ev.code === "Space") { ev.preventDefault(); audio(); doTap(W / 2 + (Math.random() * 60 - 30), H / 2 + (Math.random() * 30 - 15)); }
  });

  // Test hook, only with ?debug in the address.
  if (/[?&]debug\b/.test(location.search)) window.__ka = { get S() { return S; }, set S(v) { S = v; }, recalc, rebuildActors, renderPanel, ending, credits, startRaid };

  // ---------- boot ----------
  for (const b of document.querySelectorAll(".tab")) b.onclick = () => setTab(b.dataset.tab);
  load(); recalc();
  const away = Math.min(8 * 3600, (Date.now() - (S.last || Date.now())) / 1000);
  rebuildActors(); renderPanel(); renderHud();
  requestAnimationFrame(frame);
  setInterval(save, 10000);
  window.addEventListener("pagehide", save);
  document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });
  titleScreen(() => {
    if (!S.introDone) {
      story("intro", () => { S.introDone = true; save(); howToPlay(() => toast("Tap the yard to take field notes. Space bar works too.")); });
    } else if (away > 60 && R.nps > 0) {
      const earned = R.nps * away * offlineRate();
      S.notes += earned; S.total += earned;
      dialog([["jessi", "While you were gone, your animals kept working. You picked up " + fmt(earned) + " field notes."]]);
    }
  });
  document.addEventListener("pointerdown", () => { audio(); if (S.music && !musicTimer) startMusic(); }, { once: true });
})();

</script>

</body></html>
